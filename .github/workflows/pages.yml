name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site and stamp service worker with this commit SHA
        run: |
          mkdir -p _site
          cp -R index.html manifest.json sw.js js _site/
          sed -i "s/__COMMIT_SHA__/${GITHUB_SHA}/g" _site/sw.js
          if grep -q '__COMMIT_SHA__' _site/sw.js; then
            echo 'Service worker commit SHA placeholder was not replaced.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
