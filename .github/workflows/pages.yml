// GitHub App PKCE flow for static browser app
// - Client ID is public and can live in the app
// - Client secret is NOT used in the browser and remains unused/kept out of the repository
// - The redirect URI must exactly match the GitHub App callback URL

const DB_NAME = 'LaTeXPWA_VFS';
const DB_VERSION = 2;
const GITHUB_CLIENT_ID = 'Ov23likSsFVYCyWAjIWR';
const GITHUB_AUTH_URL = 'https://github.com/login/oauth/authorize';
const GITHUB_TOKEN_URL = 'https://github.com/login/oauth/access_token';

function getVFSKey(path, repo = '', branch = '') {
  const repoId = repo || 'local';
  const branchId = branch || 'main';
  return `${repoId}::${branchId}::${path}`;
}

function base64UrlEncode(bytes) {
  let binary = '';
  for (const byte of bytes) {
    binary += String.fromCharCode(byte);
  }
  return btoa(binary)
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/g, '');
}

function generateSecureRandomValue() {
  return base64UrlEncode(crypto.getRandomValues(new Uint8Array(32)));
}

async function generateCodeChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return base64UrlEncode(new Uint8Array(digest));
}

function redirectUri() {
  return 'https://yasminshendrik.github.io/latex_on_ipad/';
}

function clearOAuthCallbackParameters() {
  const url = new URL(window.location.href);
  ['code', 'state', 'error', 'error_description', 'error_uri'].forEach((key) => {
    url.searchParams.delete(key);
  });
  window.history.replaceState({}, document.title, `${url.pathname}${url.search}${url.hash}`);
}

async function exchangeCodeForToken(authCode, verifier) {
  const response = await fetch(GITHUB_TOKEN_URL, {
    method: 'POST',
    headers: {
      'Accept': 'application/json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      client_id: GITHUB_CLIENT_ID,
      code: authCode,
      code_verifier: verifier,
      redirect_uri: redirectUri()
    })
  });

  const data = await response.json();
  if (!response.ok || !data.access_token) {
    throw new Error(data.error_description || data.error || 'GitHub OAuth-Token-Austausch fehlgeschlagen.');
  }

  return data.access_token;
}

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => resolve(request.result);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('files')) {
        db.createObjectStore('files', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('projects')) {
        db.createObjectStore('projects', { keyPath: 'repo' });
      }
    };
  });
}

async function saveFileToVFS(path, content, repo = localStorage.getItem('gh_current_repo') || '', branch = localStorage.getItem('gh_current_branch') || 'main') {
  const db = await openDB();
  const record = {
    id: getVFSKey(path, repo, branch),
    path,
    repo,
    branch,
    content,
    updatedAt: new Date().toISOString()
  };

  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['files'], 'readwrite');
    const store = transaction.objectStore('files');
    const request = store.put(record);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function loadFileFromVFS(path, repo = localStorage.getItem('gh_current_repo') || '', branch = localStorage.getItem('gh_current_branch') || 'main') {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['files'], 'readonly');
    const store = transaction.objectStore('files');
    const key = getVFSKey(path, repo, branch);
    const request = store.get(key);

    request.onsuccess = () => {
      if (request.result) {
        resolve(request.result.content);
        return;
      }

      const legacyRequest = store.get(path);
      legacyRequest.onsuccess = () => resolve(legacyRequest.result ? legacyRequest.result.content : null);
      legacyRequest.onerror = () => reject(legacyRequest.error);
    };

    request.onerror = () => reject(request.error);
  });
}

async function fetchGitHubRepoTree(owner, repo, branch, token) {
  const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
  const response = await fetch(url, {
    headers: {
      'Accept': 'application/vnd.github.v3+json',
      'Authorization': `Bearer ${token}`
    }
  });
  if (!response.ok) throw new Error(`GitHub Tree API Fehler: ${response.statusText}`);
  const data = await response.json();
  return data.tree.filter(item => item.type === 'blob');
}

async function fetchGitHubFileContent(fileUrl, token) {
  const response = await fetch(fileUrl, {
    headers: {
      'Accept': 'application/vnd.github.v3.raw',
      'Authorization': `Bearer ${token}`
    }
  });
  if (!response.ok) throw new Error(`Fehler beim Laden der Datei: ${response.statusText}`);
  return await response.text();
}

async function fetchGitHubBranches(owner, repo, token) {
  const url = `https://api.github.com/repos/${owner}/${repo}/branches`;
  const response = await fetch(url, {
    headers: {
      'Accept': 'application/vnd.github.v3+json',
      'Authorization': `Bearer ${token}`
    }
  });
  if (!response.ok) throw new Error(`Fehler beim Laden der Branches: ${response.statusText}`);
  return await response.json();
}

function installStaticEventHandlers(appState) {
  const loginBtn = document.getElementById('gh-login-btn');
  const repoLabel = document.getElementById('repo-label');
  const branchSelect = document.getElementById('branch-select');
  const toggleSidebarBtn = document.getElementById('toggle-sidebar');
  const togglePreviewBtn = document.getElementById('toggle-preview');
  const saveBtn = document.getElementById('save-btn');

  if (loginBtn) {
    loginBtn.addEventListener('click', async () => {
      if (appState.accessToken) {
        sessionStorage.removeItem('gh_token');
        appState.accessToken = null;
        loginBtn.textContent = 'GitHub Login';
        loginBtn.style.background = '#007acc';
        alert('Erfolgreich von GitHub abgemeldet.');
        window.location.reload();
      } else {
        await triggerOAuthLogin();
      }
    });
  }

  if (toggleSidebarBtn) {
    toggleSidebarBtn.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    });
  }

  if (togglePreviewBtn) {
    togglePreviewBtn.addEventListener('click', () => {
      document.getElementById('preview-container').classList.toggle('visible');
    });
  }

  if (saveBtn) {
    saveBtn.addEventListener('click', async () => {
      if (appState.editor) {
        await saveCurrentEditorState(appState);
        alert(`Datei "${appState.currentFilePath}" lokal in IndexedDB gespeichert!`);
      }
    });
  }

  if (repoLabel) {
    repoLabel.addEventListener('click', async () => {
      const repoInput = prompt('GitHub Repository angeben (Format: owner/repo):', appState.currentRepo || 'user/repo');
      if (!repoInput) return;

      appState.currentRepo = repoInput.trim();
      localStorage.setItem('gh_current_repo', appState.currentRepo);
      repoLabel.textContent = appState.currentRepo;

      if (!appState.accessToken) {
        alert('Bitte melde dich bei GitHub an, um auf das Repository zuzugreifen.');
        await triggerOAuthLogin();
        return;
      }

      await loadRepositoryWorkspace(appState.currentRepo, appState.currentBranch, appState.accessToken, appState);
    });
  }

  if (branchSelect) {
    branchSelect.addEventListener('change', async () => {
      if (!appState.currentRepo || !appState.accessToken) return;
      appState.currentBranch = branchSelect.value;
      localStorage.setItem('gh_current_branch', appState.currentBranch);
      await loadRepositoryWorkspace(appState.currentRepo, appState.currentBranch, appState.accessToken, appState);
    });
  }
}

async function saveCurrentEditorState(appState) {
  if (!appState.editor) return;
  await saveFileToVFS(appState.currentFilePath, appState.editor.getValue(), appState.currentRepo, appState.currentBranch);
}

async function triggerOAuthLogin() {
  if (!window.crypto || !window.crypto.subtle || !window.crypto.getRandomValues) {
    alert('Dieser Browser unterstützt die sicheren OAuth-Funktionen nicht.');
    return;
  }

  const verifier = generateSecureRandomValue();
  const state = generateSecureRandomValue();
  sessionStorage.setItem('gh_pkce_verifier', verifier);
  sessionStorage.setItem('gh_oauth_state', state);

  const codeChallenge = await generateCodeChallenge(verifier);
  const params = new URLSearchParams({
    client_id: GITHUB_CLIENT_ID,
    redirect_uri: redirectUri(),
    state,
    response_type: 'code',
    code_challenge: codeChallenge,
    code_challenge_method: 'S256'
  });

  window.location.assign(`${GITHUB_AUTH_URL}?${params.toString()}`);
}

async function loadRepositoryWorkspace(repoFullName, branch, token, appState) {
  const [owner, repo] = repoFullName.split('/');
  if (!owner || !repo) {
    alert('Ungültiges Repo-Format. Nutze owner/repo');
    return;
  }

  const fileListEl = document.getElementById('file-list');
  if (fileListEl) {
    fileListEl.innerHTML = '<div style="padding: 10px; color: #888;">Lade Repository &amp; Baum...</div>';
  }

  try {
    const branches = await fetchGitHubBranches(owner, repo, token);
    const branchSelect = document.getElementById('branch-select');
    if (branchSelect) {
      branchSelect.innerHTML = '';
      branches.forEach((b) => {
        const opt = document.createElement('option');
        opt.value = b.name;
        opt.textContent = b.name;
        if (b.name === branch) opt.selected = true;
        branchSelect.appendChild(opt);
      });
    }

    const tree = await fetchGitHubRepoTree(owner, repo, branch, token);

    if (!fileListEl) return;
    fileListEl.innerHTML = '';

    tree.forEach((file) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.textContent = file.path;

      item.addEventListener('click', async () => {
        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        appState.currentFilePath = file.path;

        let content = await loadFileFromVFS(file.path, repoFullName, branch);
        if (!content) {
          content = await fetchGitHubFileContent(file.url, token);
          await saveFileToVFS(file.path, content, repoFullName, branch);
        }

        if (appState.editor) {
          appState.editor.setValue(content);
        }
      });

      fileListEl.appendChild(item);
    });
  } catch (err) {
    if (fileListEl) {
      fileListEl.textContent = `Fehler: ${err.message}`;
    }
  }
}

async function initializeApp() {
  const appState = {
    currentFilePath: 'main.tex',
    currentRepo: localStorage.getItem('gh_current_repo') || '',
    currentBranch: localStorage.getItem('gh_current_branch') || 'main',
    accessToken: sessionStorage.getItem('gh_token') || null,
    editor: null
  };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      console.warn('Service Worker konnte nicht registriert werden.');
    });
  }

  const urlParams = new URLSearchParams(window.location.search);
  const authCode = urlParams.get('code');
  const authState = urlParams.get('state');
  const authError = urlParams.get('error');

  if (authCode || authError) {
    const storedState = sessionStorage.getItem('gh_oauth_state');
    const verifier = sessionStorage.getItem('gh_pkce_verifier');
    clearOAuthCallbackParameters();

    if (!storedState || !authState || authState !== storedState) {
      sessionStorage.removeItem('gh_pkce_verifier');
      sessionStorage.removeItem('gh_oauth_state');
      alert('OAuth-Status konnte nicht verifiziert werden. Bitte erneut anmelden.');
    } else if (authError) {
      sessionStorage.removeItem('gh_pkce_verifier');
      sessionStorage.removeItem('gh_oauth_state');
      alert(`GitHub-Anmeldung abgebrochen oder fehlgeschlagen: ${authError}`);
    } else if (!verifier) {
      sessionStorage.removeItem('gh_oauth_state');
      alert('PKCE code_verifier fehlt. Bitte erneut anmelden.');
    } else {
      try {
        appState.accessToken = await exchangeCodeForToken(authCode, verifier);
        sessionStorage.setItem('gh_token', appState.accessToken);
      } catch (error) {
        appState.accessToken = null;
        sessionStorage.removeItem('gh_token');
        alert(error.message);
      } finally {
        sessionStorage.removeItem('gh_pkce_verifier');
        sessionStorage.removeItem('gh_oauth_state');
      }
    }
  }

  const loginBtn = document.getElementById('gh-login-btn');
  if (loginBtn) {
    if (appState.accessToken) {
      loginBtn.textContent = 'Verbunden';
      loginBtn.style.background = '#28a745';
    } else {
      loginBtn.textContent = 'GitHub Login';
      loginBtn.style.background = '#007acc';
    }
  }

  installStaticEventHandlers(appState);

  const editorContainer = document.getElementById('editor-container');
  if (!editorContainer) return;

  let initialContent = await loadFileFromVFS(appState.currentFilePath, appState.currentRepo, appState.currentBranch);
  if (!initialContent) {
    initialContent = '\\documentclass{article}\n\\begin{document}\n\\section{Einleitung}\nBitte mit GitHub verbinden, um zu starten!\n\\end{document}';
    await saveFileToVFS(appState.currentFilePath, initialContent, appState.currentRepo, appState.currentBranch);
  }

  if (window.require && window.require !== undefined) {
    window.require(['vs/editor/editor.main'], function() {
      const monaco = window.monaco;
      if (!monaco || !monaco.editor) {
        console.warn('Monaco konnte nicht geladen werden. Fallback-Textarea wird verwendet.');
        const fallback = document.createElement('textarea');
        fallback.value = initialContent;
        fallback.style.width = '100%';
        fallback.style.height = '100%';
        fallback.style.border = '0';
        fallback.style.resize = 'none';
        fallback.style.background = '#1e1e1e';
        fallback.style.color = '#ddd';
        fallback.style.padding = '16px';
        fallback.style.fontFamily = 'monospace';
        editorContainer.innerHTML = '';
        editorContainer.appendChild(fallback);
        appState.editor = { getValue: () => fallback.value, setValue: (value) => { fallback.value = value; } };
        return;
      }

      appState.editor = monaco.editor.create(editorContainer, {
        value: initialContent,
        language: 'latex',
        theme: 'vs-dark',
        automaticLayout: true
      });

      let saveTimeout;
      appState.editor.onDidChangeModelContent(() => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
          await saveCurrentEditorState(appState);
        }, 800);
      });
    });
  } else {
    const fallback = document.createElement('textarea');
    fallback.value = initialContent;
    fallback.style.width = '100%';
    fallback.style.height = '100%';
    fallback.style.border = '0';
    fallback.style.resize = 'none';
    fallback.style.background = '#1e1e1e';
    fallback.style.color = '#ddd';
    fallback.style.padding = '16px';
    fallback.style.fontFamily = 'monospace';
    editorContainer.innerHTML = '';
    editorContainer.appendChild(fallback);
    appState.editor = { getValue: () => fallback.value, setValue: (value) => { fallback.value = value; } };
  }

  if (appState.currentRepo && appState.accessToken) {
    await loadRepositoryWorkspace(appState.currentRepo, appState.currentBranch, appState.accessToken, appState);
  } else if (appState.currentRepo && !appState.accessToken) {
    const fileList = document.getElementById('file-list');
    if (fileList) {
      fileList.innerHTML = '<div style="padding: 10px; color: #666; font-size: 12px;">Bitte verbinde dich mit GitHub, um fortzufahren.</div>';
    }
  }
}

window.addEventListener('DOMContentLoaded', () => {
  initializeApp();
});
