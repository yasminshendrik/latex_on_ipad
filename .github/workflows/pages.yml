name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TeX worker and compiler assets
        run: |
          npm run build:tex-worker
          npm run build:assets

      - name: Run unit and compiler integration tests
        run: |
          npm test
          npm run test:integration

      - name: Prepare site and stamp service worker and build info with this commit SHA
        run: |
          mkdir -p _site
          cp -R index.html manifest.json sw.js js fonts _site/
          sed -i "s/__COMMIT_SHA__/${GITHUB_SHA}/g" _site/sw.js _site/js/build-info.js
          for asset in fonts/SAP-icons.woff2 fonts/LICENSE-APACHE-2.0.txt js/engine/tectonic_wasm.wasm js/engine/tectonic-bundle.tar.gz js/engine/packs/pack-koma-script-3.43-2024.10.24.tar.gz js/engine/packs/pack-babel-nil-2024-10-24.tar.gz js/engine/packs/pack-babel-ngerman-2024-10-24.tar.gz js/engine/packs/packs-index.json js/engine/packs/packs-integrity.json js/pdfjs/pdf.min.mjs js/pdfjs/pdf.worker.min.mjs js/tex-worker.js js/lint-worker.js js/THIRD-PARTY-NOTICES.md; do
            if [ ! -s "_site/${asset}" ]; then
              echo "Missing deployed asset: ${asset}" >&2
              exit 1
            fi
          done
          if grep -R -q '__COMMIT_SHA__' _site/sw.js _site/js/build-info.js; then
            echo 'A commit SHA placeholder was not replaced in the deployed artifacts.' >&2
            exit 1
          fi
          if ! grep -q "window.APP_BUILD_SHA = '${GITHUB_SHA}';" _site/js/build-info.js; then
            echo 'Build info does not contain the triggering commit SHA.' >&2
            exit 1
          fi
          if ! grep -q "latex-pwa-${GITHUB_SHA}" _site/sw.js; then
            echo 'Service worker cache name does not contain the triggering commit SHA.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
