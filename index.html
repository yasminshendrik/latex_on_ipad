# Prototyp: index.html

```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaTeX iPad PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #1e1e1e; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #2d2d2d; border-bottom: 1px solid #444; height: 50px; }
        .toolbar-group { display: flex; gap: 10px; align-items: center; }
        button { background: #007acc; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:active { background: #005999; }
        #main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        #sidebar { width: 250px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; transition: width 0.3s; }
        #sidebar.collapsed { width: 0; overflow: hidden; border: none; }
        #editor-container { flex: 1; height: 100%; }
        #preview-container { width: 40%; background: #fff; color: #000; display: none; border-left: 1px solid #444; padding: 20px; }
        #preview-container.visible { display: block; }
        @media (orientation: portrait) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; height: 120px; }
            #sidebar.collapsed { height: 0; }
            #preview-container { width: 100%; height: 40%; border-left: none; border-top: 1px solid #444; }
        }
    </style>
</head>
<body>
    <header>
        <div class="toolbar-group">
            <button id="toggle-sidebar">☰ Sidebar</button>
            <span>📁 Bachelorarbeit.tex</span>
            <select id="branch-select"><option>main</option></select>
        </div>
        <div class="toolbar-group">
            <button id="toggle-preview">Vorschau anzeigen</button>
            <button id="save-btn">Speichern (Lokal Commit)</button>
        </div>
    </header>
    <div id="main-container">
        <div id="sidebar">
            <div style="padding: 10px; font-size: 13px; color: #858585;">Projekt-Dateien:</div>
            <div style="padding: 8px 15px; background: #37373d; cursor: pointer;">main.tex</div>
            <div style="padding: 8px 15px; cursor: pointer;">bibliography.bib</div>
        </div>
        <div id="editor-container"></div>
        <div id="preview-container">
            <h3>PDF Vorschau (Azure WASM Build)</h3>
            <p style="color: #666;">Hier rendert die Live-Vorschau...</p>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
```
