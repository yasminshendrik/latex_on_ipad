<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LaTeX iPad PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #1e1e1e; color: #f5f5f5; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #2d2d2d; border-bottom: 1px solid #444; height: 50px; }
        .toolbar-group { display: flex; gap: 10px; align-items: center; }
        button, select { background: #007acc; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        select { background: #3c3c3c; }
        button:active { background: #005999; }
        #main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        #sidebar { width: 250px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; transition: width 0.3s; }
        #sidebar.collapsed { width: 0; overflow: hidden; border: none; }
        .file-item { padding: 8px 15px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #2d2d2d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #37373d; color: #fff; font-weight: bold; }
        #editor-container { flex: 1; height: 100%; }
        #preview-container { width: 40%; background: #fff; color: #000; display: none; border-left: 1px solid #444; padding: 20px; }
        #preview-container.visible { display: block; }
        @media (orientation: portrait) {
            #main-container { flex-direction: column; }
            #sidebar { width: 100%; height: 140px; }
            #sidebar.collapsed { height: 0; }
            #preview-container { width: 100%; height: 40%; border-left: none; border-top: 1px solid #444; }
        }
    </style>
</head>
<body>
    <header>
        <div class="toolbar-group">
            <button id="toggle-sidebar">☰ Sidebar</button>
            <button id="gh-login-btn">GitHub Login</button>
            <select id="branch-select" title="GitHub Branch wechseln">
                <option value="main">main</option>
            </select>
        </div>
        <div class="toolbar-group">
            <button id="toggle-preview">Vorschau</button>
            <button id="save-btn">Speichern</button>
        </div>
    </header>
    <div id="main-container">
        <div id="sidebar">
            <div style="padding: 10px; font-size: 12px; color: #858585; border-bottom: 1px solid #333; display: flex; justify-content: space-between;">
                <span>PROJEKT DATEIEN</span>
                <span id="repo-label" style="color: #007acc; cursor: pointer;" title="Projekt wechseln">Repo wählen</span>
            </div>
            <div id="file-list" style="overflow-y: auto; flex: 1;">
                <div style="padding: 10px; color: #666; font-size: 12px;">Bitte mit GitHub verbinden &amp; Repo wählen...</div>
            </div>
        </div>
        <div id="editor-container"></div>
        <div id="preview-container">
            <h3>PDF Vorschau</h3>
            <p style="color: #666;">Bereit für Azure WASM Build...</p>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
